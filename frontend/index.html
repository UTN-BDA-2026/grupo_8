<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busca tu</title>

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Buscador Optimizado de Productos</h1>

      <div class="search-box">
        <input
          type="text"
          id="inputBusqueda"
          placeholder="Buscar productos..."
          onkeypress="manejarKeyPress(event)"
        />
        <button onclick="ejecutarBusqueda()">Buscar</button>
      </div>

      <div class="categories-container">
        <button
          class="category-btn"
          data-id="4"
          onclick="filtrarPorCategoria(this)"
        >
          🎮 Video Games
        </button>
        <button
          class="category-btn"
          data-id="5"
          onclick="filtrarPorCategoria(this)"
        >
          💻 Software
        </button>
        <button
          class="category-btn"
          data-id="7"
          onclick="filtrarPorCategoria(this)"
        >
          📱 Cell Phones
        </button>
        <button
          class="category-btn"
          data-id="10"
          onclick="filtrarPorCategoria(this)"
        >
          🍏 Grocery
        </button>
        <button
          class="category-btn"
          data-id="11"
          onclick="filtrarPorCategoria(this)"
        >
          📷 Camera & Photo
        </button>
        <button
          class="category-btn"
          data-id="12"
          onclick="filtrarPorCategoria(this)"
        >
          🧸 Toys & Games
        </button>
        <button
          class="category-btn"
          data-id="22"
          onclick="filtrarPorCategoria(this)"
        >
          🖥️ Computers
        </button>
      </div>

      <div id="resultados">
        <div class="status-msg">
          Escribe un término para comenzar la búsqueda.
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
