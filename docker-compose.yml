version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: grupo8-backend:latest
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    POSTGRES_HOST=db
    POSTGRES_PORT=5432
    
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - appnet

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - appnet

volumes:
  postgres_data:

networks:
  appnet: