version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: grupo8-backend:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mired

  frontend:
    build:
      context: ../frontend # 👈 Sale de 'docker/' y entra directo a 'frontend/'
      dockerfile: Dockerfile
    ports:
      - "8080:80" # Tu web se abrirá en http://localhost:8080
    depends_on:
      - backend
    networks:
      - mired

  redis:
    image: redis:7.4-alpine
    container_name: redis-buscador
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    env_file:
      - .env
    networks:
      - mired

networks:
  mired:
    external: true
