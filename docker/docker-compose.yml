version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: grupo8-backend:latest
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mired

networks:
  mired:
    external: true